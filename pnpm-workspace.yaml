# pnpm 11/12: allowBuilds map is the build-script approval gate.
# (onlyBuiltDependencies list kept for pnpm 10 compat; each generation
# ignores the keys it doesn't read.)
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  workerd: true
onlyBuiltDependencies:
  - '@firebase/util'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - protobufjs
  - workerd
